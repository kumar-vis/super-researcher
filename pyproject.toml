[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "superresearcher"
version = "0.2.0"
description = "Local-first evidence research system: protocol, corpus, atlas, and publish."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vishal Kumar" }]
requires-python = ">=3.10"
keywords = ["research", "evidence", "corpus", "deep-research", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
atlas = [
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "umap-learn>=0.5",
]
convert = [
    "pymupdf>=1.23",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]
publish = [
    "pypandoc-binary>=1.14",
]
all = [
    "superresearcher[atlas,convert,publish]",
]

[project.scripts]
superresearcher = "superresearcher.cli:main"

[project.urls]
Homepage = "https://github.com/kumar-vis/super-researcher"
Issues = "https://github.com/kumar-vis/super-researcher/issues"

[tool.setuptools.packages.find]
include = ["superresearcher*"]
